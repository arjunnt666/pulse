apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      containers:
        - name: pulse
          image: pulse:latest
          ports:
            - containerPort: 7777
---
apiVersion: v1
kind: Service
metadata:
  name: pulse
spec:
  selector:
    app: pulse
  ports:
    - port: 7777
      targetPort: 7777
